name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  format:
    name: Code Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format-14
      - name: Check formatting
        run: bash tools/code_format.sh --check
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zlib1g-dev libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DMAPTILE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
  test-minimal:
    name: Build without zlib and sqlite3
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DMAPTILE_WERROR=ON -DMAPTILE_WITH_ZLIB=OFF -DMAPTILE_WITH_SQLITE=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
